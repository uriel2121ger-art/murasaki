<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A session bus that can not activate anything: no <standard_session_servicedirs/>, whose compiled-in
     /usr/share/dbus-1/services is searched whatever XDG_DATA_DIRS says (it would start the real
     xdg-desktop-portal and kglobalacceld when a test calls a name that is not there). For tests that fake
     well-known names of the user's desktop. Use it as: dbus-run-session, option config-file=THIS, then the command. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
