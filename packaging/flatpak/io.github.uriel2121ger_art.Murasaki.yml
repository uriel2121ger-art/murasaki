# Flatpak manifest for Murasaki (Flathub style). See README.md next to this file for how to build it and for the
# decisions behind the permissions and the sandbox. The manifest builds with flatpak-builder (kde-6.11 image of
# flathub-infra/flatpak-github-actions); tools/lint-flatpak.py checks it without flatpak-builder.
app-id: io.github.uriel2121ger_art.Murasaki
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: murasaki

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # PipeWire clients reach the audio server through the PulseAudio socket of the sandbox.
  - --socket=pulseaudio
  # Web wallpapers are off the network by default inside Murasaki; the Workshop browser and the items that were allowed
  # need it.
  - --share=network
  # Murasaki starts nothing on the host and talks to the session only through these names.
  - --talk-name=org.kde.KWin
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.Notifications
  # The user's Steam libraries (Wallpaper Engine items and assets), read only. Steam itself is never started.
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam:ro
  # Murasaki's own state is in the usual XDG directories of the sandbox.
  # The daemon starts murasaki-overlay (the pets) through the user's systemd when it can; the sandbox can not reach it, so
  # the daemon asks the bus to activate the overlay's name instead (the exported service file, see post-install).

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - '*.a'

modules:
  - name: lz4
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS PREFIX=${FLATPAK_DEST} install
    cleanup: [/bin, /share/man]
    sources:
      - type: archive
        url: https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz
        sha256: 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b

  - name: libass
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  # LGPL FFmpeg only (no --enable-gpl): the decoders mpv and the sprite decoder need, nothing else. See LICENSING.md.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-debug
      - --disable-gpl
      - --disable-nonfree
      - --enable-vaapi
      - --enable-libdrm
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.1.tar.xz
        sha256: 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dvulkan=enabled
      - -Dlcms=disabled
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  # libmpv built as LGPL (-Dgpl=false) so that Murasaki, which also has a commercial license, can ship it.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
        sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3

  # Not part of the KDE runtime.
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.4.5/layer-shell-qt-6.4.5.tar.xz
        sha256: ef6baae22114f038af89029f3f0075ee29c3b91fd49100828c4c3a32e1496e95

  # The glslang release the Vulkan engine compiles shaders with is fetched by the build; flatpak-builder has no network
  # while building, so the tarball is a source and MURASAKI_FETCH_DIR points at it (the file name is what FetchContent looks for).
  - name: murasaki
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      # Fail the build instead of quietly dropping the wallpaper host or the GUI when a dependency is missing.
      - -DMURASAKI_BUILD_SURFACE=ON
      - -DMURASAKI_BUILD_APP=ON
      - -DMURASAKI_FETCH_DIR=/run/build/murasaki/fetch
      - -DMURASAKI_SYSTEMD_USER_UNIT_DIR=share/systemd/user
    sources:
      - type: dir
        path: ../..
        skip: [build, .git]
      - type: file
        url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.6.0.tar.gz
        sha256: 9c09b901149c729df745057dafa815278aaa101b84d2b6e14f16a42de52f97f2
        dest: fetch
        dest-filename: 16.6.0.tar.gz
    post-install:
      # Flatpak exports the desktop file, icon and metainfo of the app id; the overlay's hidden entry and the Plasma
      # wallpaper package have no use inside a sandbox (the host's plasmashell can not load them from here).
      - rm -rf ${FLATPAK_DEST}/share/plasma ${FLATPAK_DEST}/share/murasaki/plasma ${FLATPAK_DEST}/share/gnome-shell
      - rm -f ${FLATPAK_DEST}/share/applications/io.github.uriel2121ger_art.Murasaki.Overlay.desktop
      # No systemd inside the sandbox: the exported D-Bus service files must start the program themselves (flatpak
      # rewrites Exec to `flatpak run --command=...`), so drop the SystemdService= lines and give the surface a file too.
      - sed -i '/^SystemdService=/d' ${FLATPAK_DEST}/share/dbus-1/services/*.service
      - rm -rf ${FLATPAK_DEST}/share/systemd
      - |
        printf '[D-BUS Service]\nName=io.github.uriel2121ger_art.Murasaki.Surface\nExec=%s/bin/murasaki-surface\n' "${FLATPAK_DEST}" \
          > ${FLATPAK_DEST}/share/dbus-1/services/io.github.uriel2121ger_art.Murasaki.Surface.service
